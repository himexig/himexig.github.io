<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラクター紹介シート作成ツール</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
    .modal-active {
      opacity: 1;
      visibility: visible;
    }
    .modal-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-32 lg:pb-0">

  <!-- 汎用トースト通知 -->
  <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none flex items-center gap-2 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-medium whitespace-nowrap">
    <i id="toast-icon" data-lucide="info" class="w-5 h-5"></i>
    <span id="toast-message">メッセージ</span>
  </div>

  <!-- 一括クリア確認モーダル -->
  <div id="confirm-modal" class="modal-hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center px-4 transition-all duration-200">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-200" id="confirm-modal-box">
      <div class="flex items-center gap-3 text-red-600 mb-4">
        <div class="p-2 bg-red-50 rounded-full">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800">すべての入力をクリア</h3>
      </div>
      <p class="text-slate-600 mb-8 text-sm leading-relaxed">入力した内容と保存データをすべて消去します。<br>この操作は取り消せません。本当によろしいですか？</p>
      <div class="flex justify-end gap-3">
        <button onclick="hideClearModal()" class="px-5 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors active:scale-95">キャンセル</button>
        <button onclick="executeClearAll()" class="px-5 py-2.5 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition-colors active:scale-95 shadow-md shadow-red-600/20">クリアする</button>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <i data-lucide="user-square-2" class="text-indigo-600"></i>
        <span class="hidden sm:inline">キャラクター紹介シート作成</span>
        <span class="sm:hidden">紹介シート作成</span>
      </h1>
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 保存状態インジケーター -->
        <div id="save-indicator" class="hidden text-xs text-slate-400 items-center gap-1 mr-2">
          <i data-lucide="check" class="w-3 h-3 text-green-500"></i>
          <span class="hidden sm:inline">自動保存済み</span>
        </div>
        <!-- 一括クリア（PC） -->
        <button 
          onclick="showClearModal()"
          class="hidden lg:flex items-center gap-1.5 text-slate-500 hover:text-red-600 px-3 py-2 rounded-lg hover:bg-red-50 transition-colors font-medium text-sm"
        >
          <i data-lucide="trash" class="w-4 h-4"></i>
          <span>一括クリア</span>
        </button>
        <!-- コピーボタン（PC） -->
        <button 
          onclick="copyToClipboard()"
          id="header-copy-btn"
          class="hidden lg:flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-all shadow-sm font-medium text-sm active:scale-95"
        >
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span id="header-copy-btn-text">テキストをコピー</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-4 py-6 lg:py-8">
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- 左側：入力フォーム -->
      <div class="lg:w-7/12 xl:w-2/3 space-y-6">
        
        <!-- 名前 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <input 
            type="text" 
            id="char-name" 
            oninput="updatePreview()"
            class="w-full text-2xl lg:text-3xl font-bold bg-transparent border-b-2 border-slate-200 focus:border-indigo-500 outline-none pb-2 placeholder-slate-300 transition-colors"
            placeholder="キャラクターの名前を入力"
          />
        </div>

        <!-- 過去、設定 -->
        <div class="bg-white shadow-sm rounded-xl p-5 border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-5 bg-indigo-500 rounded-full"></span>
            〇過去、設定
          </h2>
          <div id="past-settings-list" class="space-y-3"></div>
          <button onclick="addListItem('past-settings-list', '過去の出来事や基本設定...')" class="mt-4 flex items-center justify-center w-full py-2 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-colors text-sm font-medium">
            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 項目を追加
          </button>
        </div>

        <!-- モットー（信念） -->
        <div class="bg-white shadow-sm rounded-xl p-5 border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-5 bg-indigo-500 rounded-full"></span>
            〇モットー（信念）
          </h2>
          <div id="mottos-list" class="space-y-3"></div>
          <button onclick="addListItem('mottos-list', '譲れない信念や座右の銘など...')" class="mt-4 flex items-center justify-center w-full py-2 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-colors text-sm font-medium">
            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 項目を追加
          </button>
        </div>

        <!-- 性格、特徴 -->
        <div class="bg-white shadow-sm rounded-xl p-5 border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-5 bg-indigo-500 rounded-full"></span>
            〇性格、特徴
          </h2>
          <div id="traits-list" class="space-y-3"></div>
          <button onclick="addListItem('traits-list', '性格や身体的な特徴など...')" class="mt-4 flex items-center justify-center w-full py-2 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-colors text-sm font-medium">
            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 項目を追加
          </button>
        </div>

        <!-- 自分用メモ -->
        <div class="bg-white shadow-sm rounded-xl p-5 border border-slate-200">
          <h2 class="text-lg font-bold mb-5 text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-5 bg-teal-500 rounded-full"></span>
            〇自分用メモ
          </h2>
          
          <!-- 共鳴感情 -->
          <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
            <h3 class="font-semibold text-slate-700 mb-3 text-sm">【共鳴感情】</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">表</label>
                <input type="text" id="resonance-front" oninput="updatePreview()" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-teal-400 outline-none" placeholder="〇〇" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">裏</label>
                <input type="text" id="resonance-back" oninput="updatePreview()" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-teal-400 outline-none" placeholder="〇〇" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">ルーツ</label>
                <input type="text" id="resonance-roots" oninput="updatePreview()" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-teal-400 outline-none" placeholder="〇〇" />
              </div>
            </div>
          </div>

          <!-- 名前の由来 -->
          <div class="mb-6">
            <h3 class="font-semibold text-slate-700 mb-2 flex items-center text-sm">
              <span class="mr-1">・</span>名前の由来
            </h3>
            <textarea id="name-origin" oninput="updatePreview()" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-teal-400 outline-none min-h-[80px] bg-slate-50 resize-y" placeholder="名前の由来や込めた意味など..."></textarea>
          </div>

          <!-- 任意の追加メモ -->
          <div>
            <h3 class="font-semibold text-slate-700 mb-3 flex items-center text-sm">
              <span class="mr-1">・</span>その他のメモ
            </h3>
            <div id="memos-list" class="space-y-3"></div>
            <button onclick="addListItem('memos-list', '自由なメモ...')" class="text-teal-600 hover:text-teal-800 hover:bg-teal-50 rounded-md text-sm font-medium flex items-center mt-2 p-2 transition-colors w-full justify-center border border-transparent border-dashed hover:border-teal-300">
              <i data-lucide="plus" class="w-4 h-4 mr-1"></i> メモ項目を追加
            </button>
          </div>
        </div>

        <!-- セリフ -->
        <div class="bg-white shadow-sm rounded-xl p-5 border border-slate-200">
          <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
            <span class="w-1.5 h-5 bg-indigo-500 rounded-full"></span>
            〇セリフ
          </h2>
          <div id="quotes-list" class="space-y-3"></div>
          <button onclick="addListItem('quotes-list', '印象的なセリフ...', true)" class="mt-4 flex items-center justify-center w-full py-2 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 transition-colors text-sm font-medium">
            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 項目を追加
          </button>
        </div>

        <!-- スマホ用：画面最下部の一括クリアボタン -->
        <div class="lg:hidden flex justify-center pb-4">
          <button onclick="showClearModal()" class="flex items-center gap-1.5 text-slate-400 hover:text-red-500 px-4 py-3 rounded-xl border-2 border-slate-200 bg-white shadow-sm font-bold text-sm w-full justify-center transition-colors active:scale-95">
            <i data-lucide="trash" class="w-4 h-4"></i>
            <span>すべての入力をクリア</span>
          </button>
        </div>

      </div>

      <!-- 右側：プレビュー画面 -->
      <div class="lg:w-5/12 xl:w-1/3">
        <div class="lg:sticky lg:top-24 bg-slate-800 text-slate-100 rounded-xl shadow-xl overflow-hidden border border-slate-700 flex flex-col max-h-[calc(100vh-120px)]">
          <div class="bg-slate-900 px-5 py-4 border-b border-slate-700 flex justify-between items-center shrink-0">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">完成プレビュー</h2>
            <div class="flex space-x-1.5">
              <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
              <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
              <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
            </div>
          </div>
          <div class="p-5 overflow-y-auto grow custom-scrollbar min-h-[250px] bg-slate-900/40">
            <pre id="preview-text" class="whitespace-pre-wrap font-mono text-sm leading-relaxed text-slate-200 hidden"></pre>
            <div id="preview-empty" class="h-full flex flex-col items-center justify-center text-slate-500 opacity-60 space-y-3 py-12">
              <i data-lucide="user-round" class="w-12 h-12"></i>
              <p class="text-sm text-center">項目を入力すると<br>ここにテキストが表示されます</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- モバイル用コピーボタン -->
  <button 
    onclick="copyToClipboard()"
    id="mobile-copy-btn"
    class="lg:hidden fixed bottom-12 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg shadow-indigo-600/30 flex items-center justify-center z-50 hover:bg-indigo-700 active:scale-95 transition-all"
    aria-label="テキストをコピー"
  >
    <i data-lucide="copy" class="w-6 h-6" id="mobile-copy-icon"></i>
  </button>

  <script>
    // --- 汎用トースト通知 ---
    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const icon = document.getElementById('toast-icon');
      
      // スタイルのリセットと設定
      toast.className = "fixed top-4 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none flex items-center gap-2 px-5 py-3 rounded-xl shadow-xl text-sm font-medium whitespace-nowrap";
      
      if (type === 'success') {
        toast.classList.add('bg-teal-600', 'text-white');
        icon.setAttribute('data-lucide', 'check-circle');
      } else if (type === 'info') {
        toast.classList.add('bg-indigo-600', 'text-white');
        icon.setAttribute('data-lucide', 'info');
      } else {
        toast.classList.add('bg-red-600', 'text-white');
        icon.setAttribute('data-lucide', 'alert-circle');
      }
      
      lucide.createIcons();
      toastMessage.textContent = message;
      
      // 表示アニメーション
      toast.classList.remove('opacity-0', '-translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      // 非表示アニメーション
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4');
      }, 3000);
    }

    // --- 一括クリアモーダル制御 ---
    function showClearModal() {
      const modal = document.getElementById('confirm-modal');
      const box = document.getElementById('confirm-modal-box');
      modal.classList.remove('modal-hidden');
      modal.classList.add('modal-active');
      setTimeout(() => { box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
    }

    function hideClearModal() {
      const modal = document.getElementById('confirm-modal');
      const box = document.getElementById('confirm-modal-box');
      box.classList.remove('scale-100');
      box.classList.add('scale-95');
      setTimeout(() => { modal.classList.remove('modal-active'); modal.classList.add('modal-hidden'); }, 200);
    }

    // --- ローカルストレージ自動保存・復元 ---
    const STORAGE_KEY = 'charSheetData';

    function getListValues(containerId) {
      const container = document.getElementById(containerId);
      const textareas = container.querySelectorAll('textarea');
      return Array.from(textareas).map(ta => ta.value);
    }

    function saveData() {
      const data = {
        name: document.getElementById('char-name').value,
        pastSettings: getListValues('past-settings-list'),
        mottos: getListValues('mottos-list'),
        traits: getListValues('traits-list'),
        resonance: {
          front: document.getElementById('resonance-front').value,
          back: document.getElementById('resonance-back').value,
          roots: document.getElementById('resonance-roots').value
        },
        nameOrigin: document.getElementById('name-origin').value,
        memos: getListValues('memos-list'),
        quotes: getListValues('quotes-list')
      };
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      
      // 保存インジケーターをチラッと表示
      const indicator = document.getElementById('save-indicator');
      indicator.classList.remove('hidden');
      indicator.classList.add('flex');
      clearTimeout(window.saveIndicatorTimer);
      window.saveIndicatorTimer = setTimeout(() => {
        indicator.classList.add('hidden');
        indicator.classList.remove('flex');
      }, 2000);
    }

    function restoreList(containerId, values, placeholder, isQuote = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = ''; // リセット
      if (values && values.length > 0) {
        values.forEach(val => addListItem(containerId, placeholder, isQuote, val));
      } else {
        addListItem(containerId, placeholder, isQuote);
      }
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          document.getElementById('char-name').value = data.name || '';
          document.getElementById('resonance-front').value = data.resonance?.front || '';
          document.getElementById('resonance-back').value = data.resonance?.back || '';
          document.getElementById('resonance-roots').value = data.resonance?.roots || '';
          document.getElementById('name-origin').value = data.nameOrigin || '';

          restoreList('past-settings-list', data.pastSettings, '過去の出来事や基本設定...');
          restoreList('mottos-list', data.mottos, '譲れない信念や座右の銘など...');
          restoreList('traits-list', data.traits, '性格や身体的な特徴など...');
          restoreList('memos-list', data.memos, '自由なメモ...');
          restoreList('quotes-list', data.quotes, '印象的なセリフ...', true);
          return true;
        } catch (e) {
          console.error('保存データの読み込みに失敗しました', e);
        }
      }
      return false;
    }

    // --- ロジック ---

    // プレーンテキスト構築関数
    function generateText() {
      let output = [];
      const name = document.getElementById('char-name').value.trim();

      if (name) {
        output.push(name);
        output.push('');
      }

      const appendListSection = (title, containerId, prefix = '・', isQuote = false) => {
        const container = document.getElementById(containerId);
        const textareas = container.querySelectorAll('textarea');
        const validItems = [];
        textareas.forEach(ta => {
          const val = ta.value.trim();
          if (val) validItems.push(val);
        });

        if (validItems.length > 0) {
          output.push(`〇${title}`);
          validItems.forEach(item => {
            if (isQuote) output.push(`「${item}」`);
            else output.push(`${prefix}${item}`);
          });
          output.push('');
        }
      };

      appendListSection('過去、設定', 'past-settings-list');
      appendListSection('モットー（信念）', 'mottos-list');
      appendListSection('性格、特徴', 'traits-list');

      let hasMemoContent = false;
      let memoSection = [`〇自分用メモ`];

      const front = document.getElementById('resonance-front').value.trim();
      const back = document.getElementById('resonance-back').value.trim();
      const roots = document.getElementById('resonance-roots').value.trim();

      if (front || back || roots) {
        memoSection.push(`【共鳴感情】`);
        memoSection.push(`表:${front || '〇〇'}／裏:${back || '〇〇'}／ルーツ:${roots || '〇〇'}`);
        memoSection.push('');
        hasMemoContent = true;
      }

      const nameOrigin = document.getElementById('name-origin').value.trim();
      if (nameOrigin) {
        memoSection.push(`・名前の由来`);
        memoSection.push(nameOrigin);
        memoSection.push('');
        hasMemoContent = true;
      }

      const memoTextareas = document.getElementById('memos-list').querySelectorAll('textarea');
      const validMemos = [];
      memoTextareas.forEach(ta => {
        const val = ta.value.trim();
        if (val) validMemos.push(val);
      });

      if (validMemos.length > 0) {
        validMemos.forEach(m => memoSection.push(`・${m}`));
        memoSection.push('');
        hasMemoContent = true;
      }

      if (hasMemoContent) {
        output.push(...memoSection);
      }

      appendListSection('セリフ', 'quotes-list', '', true);

      return output.join('\n').trim();
    }

    // プレビューと保存の更新
    function updatePreview() {
      const text = generateText();
      const previewText = document.getElementById('preview-text');
      const previewEmpty = document.getElementById('preview-empty');

      if (text) {
        previewText.textContent = text;
        previewText.classList.remove('hidden');
        previewEmpty.classList.add('hidden');
      } else {
        previewText.classList.add('hidden');
        previewEmpty.classList.remove('hidden');
      }

      saveData(); // 変更があるたびに自動保存
    }

    // リスト項目の動的追加（値の復元対応、上下ボタン追加）
    function addListItem(containerId, placeholder, isQuote = false, initialValue = '') {
      const container = document.getElementById(containerId);
      const div = document.createElement('div');
      div.className = 'flex items-start mb-3 group';

      const bullet = isQuote 
        ? '<span class="mt-2 mr-1 text-slate-400 font-bold select-none shrink-0">「</span>' 
        : '<span class="mt-2 mr-2 text-slate-400 select-none shrink-0">・</span>';

      const closingQuote = isQuote 
        ? '<span class="mt-2 ml-1 text-slate-400 font-bold select-none shrink-0">」</span>' 
        : '';

      // textareaの値をエスケープ（XSS対策）して埋め込む
      const safeValue = initialValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      div.innerHTML = `
        ${bullet}
        <textarea
          oninput="updatePreview()"
          class="flex-1 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none resize-y min-h-[60px] bg-slate-50"
          placeholder="${placeholder}"
        >${safeValue}</textarea>
        ${closingQuote}
        <div class="flex flex-col ml-2 gap-1 shrink-0 opacity-80 group-hover:opacity-100 transition-opacity">
          <button onclick="moveUpListItem(this)" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded bg-white border border-slate-200 shadow-sm" title="上へ移動">
            <i data-lucide="chevron-up" class="w-[14px] h-[14px]"></i>
          </button>
          <button onclick="moveDownListItem(this)" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded bg-white border border-slate-200 shadow-sm" title="下へ移動">
            <i data-lucide="chevron-down" class="w-[14px] h-[14px]"></i>
          </button>
          <button onclick="removeListItem(this)" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded bg-white border border-slate-200 shadow-sm" title="削除">
            <i data-lucide="trash-2" class="w-[14px] h-[14px]"></i>
          </button>
        </div>
      `;

      container.appendChild(div);
      lucide.createIcons();
      if(!initialValue) updatePreview(); // 新規追加時は保存トリガー
    }

    // --- 項目の操作（削除・上へ・下へ） ---
    function removeListItem(buttonElement) {
      const row = buttonElement.closest('.flex.items-start');
      row.remove();
      updatePreview();
    }

    function moveUpListItem(buttonElement) {
      const row = buttonElement.closest('.flex.items-start');
      const prev = row.previousElementSibling;
      if (prev) {
        row.parentNode.insertBefore(row, prev);
        updatePreview();
      }
    }

    function moveDownListItem(buttonElement) {
      const row = buttonElement.closest('.flex.items-start');
      const next = row.nextElementSibling;
      if (next) {
        row.parentNode.insertBefore(next, row); // nextをrowの前に移動 ＝ rowをnextの後ろに移動
        updatePreview();
      }
    }

    // --- 一括クリア実行処理 ---
    function executeClearAll() {
      hideClearModal();

      // ローカルストレージをクリア
      localStorage.removeItem(STORAGE_KEY);

      // 値を空にする
      document.getElementById('char-name').value = '';
      document.getElementById('resonance-front').value = '';
      document.getElementById('resonance-back').value = '';
      document.getElementById('resonance-roots').value = '';
      document.getElementById('name-origin').value = '';

      // 各リストを空枠1つにリセット
      const lists = [
        { id: 'past-settings-list', placeholder: '過去の出来事や基本設定...' },
        { id: 'mottos-list', placeholder: '譲れない信念や座右の銘など...' },
        { id: 'traits-list', placeholder: '性格や身体的な特徴など...' },
        { id: 'memos-list', placeholder: '自由なメモ...' },
        { id: 'quotes-list', placeholder: '印象的なセリフ...', isQuote: true }
      ];

      lists.forEach(list => {
        const container = document.getElementById(list.id);
        container.innerHTML = ''; 
        addListItem(list.id, list.placeholder, list.isQuote); 
      });

      updatePreview();
      showToast('すべてのデータをクリアしました', 'success');
    }

    // --- コピー処理 ---
    function copyToClipboard() {
      const text = generateText();
      if (!text) {
        showToast('コピーするテキストがありません。項目を入力してください。', 'error');
        return;
      }

      const handleVisualFeedback = () => {
        const headerBtn = document.getElementById('header-copy-btn');
        const headerText = document.getElementById('header-copy-btn-text');
        
        headerBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
        headerBtn.classList.add('bg-green-600');
        headerText.textContent = 'コピーしました！';
        
        const mobileBtn = document.getElementById('mobile-copy-btn');
        mobileBtn.classList.remove('bg-indigo-600');
        mobileBtn.classList.add('bg-green-600');
        
        headerBtn.querySelector('i').setAttribute('data-lucide', 'check');
        document.getElementById('mobile-copy-icon').setAttribute('data-lucide', 'check');
        lucide.createIcons();

        showToast('クリップボードにコピーしました！', 'success');

        setTimeout(() => {
          headerBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
          headerBtn.classList.remove('bg-green-600');
          headerText.textContent = 'テキストをコピー';
          
          mobileBtn.classList.add('bg-indigo-600');
          mobileBtn.classList.remove('bg-green-600');
          
          headerBtn.querySelector('i').setAttribute('data-lucide', 'copy');
          document.getElementById('mobile-copy-icon').setAttribute('data-lucide', 'copy');
          lucide.createIcons();
        }, 2000);
      };

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(handleVisualFeedback).catch(err => {
          fallbackCopy(text, handleVisualFeedback);
        });
      } else {
        fallbackCopy(text, handleVisualFeedback);
      }
    }

    function fallbackCopy(text, callback) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed"; 
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) callback();
      } catch (err) {
        showToast('コピーに失敗しました', 'error');
      }
      document.body.removeChild(textArea);
    }

    // --- 初期起動セットアップ ---
    window.onload = function() {
      lucide.createIcons();
      
      const hasData = loadData();
      
      if (!hasData) {
        // 保存データがない場合は空枠を作成
        addListItem('past-settings-list', '過去の出来事や基本設定...');
        addListItem('mottos-list', '譲れない信念や座右の銘など...');
        addListItem('traits-list', '性格や身体的な特徴など...');
        addListItem('memos-list', '自由なメモ...');
        addListItem('quotes-list', '印象的なセリフ...', true);
      } else {
        // データ復元成功時
        showToast('前回の続きから再開しました', 'info');
      }
      
      updatePreview();
    }
  </script>
</body>
</html>
